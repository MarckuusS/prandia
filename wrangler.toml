# =============================================================================
# Cloudflare Pages : site + API de Prandia.
#
# C'est une configuration PAGES, pas WORKER. La distinction est structurante :
#
# Un Worker separe aurait besoin d'une route du type
# `prandia.pages.dev/api/*` — impossible, les routes Worker exigent un
# domaine qu'on possede, et `pages.dev` appartient a Cloudflare. Sans domaine
# personnalise, l'API doit donc etre livree AVEC le site.
#
# D'ou le mode avance de Pages Functions : le build produit
# `web/dist/_worker.js`, que Pages execute devant chaque requete. Il traite
# /api/*, et delegue tout le reste aux fichiers statiques via `env.ASSETS`.
#
# Consequence pratique : les liaisons (D1, KV, R2) declarees ici sont
# versionnees, au lieu d'etre saisies a la main dans le tableau de bord.
#
# Aucun secret dans ce fichier. Les jetons passent par
# `wrangler pages secret put`, et par .dev.vars en local — tous deux hors du
# depot, qui est public.
# =============================================================================

name = "prandia"
pages_build_output_dir = "web/dist"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# --- Base de donnees ---------------------------------------------------------
# Cet identifiant n'est PAS un secret : il n'autorise rien sans les
# identifiants du compte. Region WEUR (Europe de l'Ouest).
[[d1_databases]]
binding = "DB"
database_name = "prandia"
database_id = "b8a05209-f6d0-4cbb-84e8-2fea44cf7e87"
migrations_dir = "migrations"

[vars]
# Envoye a OpenFoodFacts, qui limite plus severement les clients anonymes :
# s'identifier est dans notre interet.
#
# DEPOT PUBLIC — pas d'adresse mail ici. OFF accepte tres bien une URL de
# projet comme moyen de contact, ce qui evite d'exposer une adresse aux
# moissonneurs de spam.
OFF_USER_AGENT = "prandia/0.2.0 (+https://github.com/MarckuusS/prandia)"
ENVIRONMENT = "production"
# Notifications (Web Push). La cle PUBLIQUE n'est pas un secret : l'appareil en
# a besoin pour s'abonner. La cle PRIVEE, elle, est un secret pose par
# `wrangler pages secret put VAPID_PRIVATE_KEY` et jamais ecrit ici. Le sujet
# identifie l'expediteur aupres des services d'Apple et de Google : une URL,
# pas d'adresse mail, le depot etant public. Voir worker/src/push.ts.
VAPID_PUBLIC_KEY = "BGq6OwuatQjSXdBVUIAiw_m27ULML7I6Z_MHobvwflw9Je5CSruosO5RjseVRsWQgL11vOihgmHVERZ7wOhk8hs"
VAPID_SUBJECT = "https://prandia.pages.dev"

# --- Stockage d'objets -------------------------------------------------------
# Photos de recettes, et plus tard les PDF de tickets.
#
# Le commentaire precedent attribuait le blocage a un jeton sans la portee `r2`.
# C'etait faux : R2 n'avait simplement jamais ete active sur le compte, et
# l'API repondait 10042 a tout le monde, wrangler comme dashboard. Active le
# 2026-08-10, bucket cree dans la foulee.
#
# JURIDICTION EU, ET NON UNE SIMPLE ZONE. La difference n'est pas cosmetique.
#
# Le commentaire precedent annoncait "zone WEUR, comme D1" et conseillait
# `--location weur`. C'etait faux deux fois. D'abord parce que le bucket avait
# ete cree SANS ce drapeau et se trouvait donc en ENAM, cote est des Etats-Unis,
# pendant que le commentaire affirmait le contraire. Ensuite parce que
# `--location` n'est qu'un INDICE que Cloudflare est libre d'ignorer : verifie
# le 2026-08-14, un bucket recree avec `--location weur` est ressorti en ENAM.
#
# `--jurisdiction eu` est d'une autre nature : la documentation le donne comme
# une GARANTIE que les objets sont stockes et traites dans la juridiction, et
# c'est le mecanisme prevu pour le RGPD. Le bucket vit desormais dans un espace
# de noms separe, d'ou la ligne `jurisdiction` ci-dessous : SANS ELLE, le Worker
# ne trouve plus le bucket du tout, il cherche dans la juridiction par defaut ou
# il n'y a plus rien.
#
# La manoeuvre etait gratuite parce que le bucket etait VIDE : aucun code n'y
# avait jamais ecrit. Elle ne le sera plus. Un bucket ne change pas de
# juridiction apres coup, il faudrait recopier chaque objet.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "prandia-media"
jurisdiction = "eu"
