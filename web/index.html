<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : sans lui, iOS laisse des bandes blanches autour de
         l'encoche en mode plein ecran, et env(safe-area-inset-*) reste a 0.

         maximum-scale=1 + user-scalable=no : le pincement a deux doigts zoomait
         par accident et laissait l'ecran dans un etat incomprehensible, sans
         geste evident pour en sortir. L'interface est deja dimensionnee pour le
         telephone — texte a 16 px minimum, cibles a 44 px — donc le zoom n'y
         apporte rien qu'un accident.

         iOS IGNORE ces deux attributs dans un onglet Safari, volontairement.
         Il les honore une fois l'application installee sur l'ecran d'accueil,
         qui est l'usage vise. Le repli pour le mode onglet vit dans
         src/lib/gestures.ts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="description" content="Recettes, courses, semaine, frigo et objectifs nutritionnels." />

    <title>Prandia</title>

    <!-- Installation sur l'ecran d'accueil iOS. Safari ignore encore une partie
         du manifeste : ces balises font le travail sur iPhone. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` et NON `black-translucent`. Depuis iOS 26, une application
         installee qui passe sous la barre d'etat recoit un flou "Liquid Glass"
         sur la centaine de pixels du haut : l'en-tete, ses icones et le titre
         devenaient flous et genaient le doigt. Aucune regle CSS ne le coupe.
         Avec `default`, la page commence SOUS une barre d'etat opaque, peinte
         de `theme-color`. iOS ne relit cette balise qu'a l'ajout a l'ecran
         d'accueil : une icone deja installee garde l'ancien reglage. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prandia" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Deux couleurs : la barre systeme suit le theme du telephone. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11150b" />

    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script>
      // Applique le theme enregistre AVANT le premier rendu. Sans ce script
      // inline, un utilisateur en mode sombre voit un flash blanc au lancement.
      try {
        const saved = localStorage.getItem('theme')
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.dataset.theme = saved
        }
      } catch {
        /* localStorage indisponible en navigation privee : on suit le systeme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
