# =============================================================================
# Prandia : la planification des notifications.
#
# Un Worker A PART, sans route : son horloge (un Durable Object) se reveille
# toutes les cinq minutes, lit la base `prandia` et envoie les rappels dus.
# Pages ne sait pas declencher une action a heure fixe, d'ou ce Worker. Les
# rappels n'ont pas de declencheur horaire (cron) : le plan gratuit en bornait
# le COMPTE a cinq, tous pris par d'autres projets. Depuis le plan payant, un
# declencheur horaire porte la SAUVEGARDE de la base. Voir worker/src/notifier.ts.
#
# IL NE SE DEPLOIE PAS PAR LE PUSH SUR MAIN, contrairement au site :
#     npx wrangler deploy --config notifier/wrangler.toml
# La cle privee est un secret, pose une fois :
#     npx wrangler secret put VAPID_PRIVATE_KEY --config notifier/wrangler.toml
# =============================================================================

name = "prandia-notifier"
main = "../worker/src/notifier.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
# Aucune adresse publique : ce Worker ne repond a rien, il ne fait qu'envoyer.
workers_dev = false
preview_urls = false

# L'horloge. Le site s'y lie aussi, par `script_name`, pour la remonter.
[[durable_objects.bindings]]
name = "HORLOGE"
class_name = "Horloge"

# Stockage SQLite : le seul qu'accepte le plan gratuit pour un Durable Object.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Horloge"]

# La MEME base que le site, par son identifiant.
[[d1_databases]]
binding = "DB"
database_name = "prandia"
database_id = "b8a05209-f6d0-4cbb-84e8-2fea44cf7e87"

# La sauvegarde de la base (worker/src/sauvegarde.ts) : un passage par heure,
# une copie par jour (heure de Paris), retentee l'heure d'apres si elle echoue.
# Un declencheur horaire est possible depuis le plan payant (2026-10-11) ; les
# rappels, eux, restent sur l'horloge.
[triggers]
crons = ["17 * * * *"]

# Les sauvegardes vont dans le bucket des photos, sous `sauvegardes/`. Aucune
# route ne les sert : la route des photos ne lit que la cle d'une recette.
# `jurisdiction` est indispensable, comme pour le site (CLAUDE.md, photo de garde).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "prandia-media"
jurisdiction = "eu"

[vars]
# Memes valeurs que dans wrangler.toml a la racine : la cle publique doit etre
# celle dont la privee est posee en secret ici.
VAPID_PUBLIC_KEY = "BGq6OwuatQjSXdBVUIAiw_m27ULML7I6Z_MHobvwflw9Je5CSruosO5RjseVRsWQgL11vOihgmHVERZ7wOhk8hs"
VAPID_SUBJECT = "https://prandia.pages.dev"
